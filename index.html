  <p class="lead">Дайте відповідь на 11 питань і дізнайтеся, які фактори найімовірніше стоять за вашим випадінням і стоншенням, що перевірити в першу чергу і чому догляд досі не допомагав.</p>
  <div class="facts">
    <div class="fact"><b>2000+</b>пацієнток в практиці</div>
    <div class="fact"><b>6</b>типових причин</div>
    <div class="fact"><b>11</b>питань</div>
  </div>
  <button class="btn" id="go">Пройти тест</button>
  <div class="expert"><div class="av">О</div><span>Тест складено на основі методики Олі Євміної, дипломованого дієтолога-трихолога з вищою медичною освітою (Краків).</span></div>`);
  document.getElementById("go").onclick = ()=>{ px("trackCustom","QuizStart"); step=0; render(); };
}

function question(){
  const q = Q[step], sel = ans[step];
  px("trackCustom","Question_"+(step+1), {question: step+1});
  el(`<div class="progress"><span>${step+1} з ${Q.length}</span><div class="bar"><i style="width:${(step+1)/Q.length*100}%"></i></div></div>
  <h2>${q.t}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:""}
  <div class="opts">${q.o.map((o,i)=>`<button type="button" id="q${step}o${i}" class="opt ${q.multi?"multi":""}" aria-pressed="${sel.has(i)}" data-i="${i}"><span class="mark"></span><span>${o[0]}</span></button>`).join("")}</div>
  <div class="nav"><button class="btn ghost" id="back">Назад</button><button class="btn" id="next" ${sel.size?"":"disabled"}>Далі</button></div>`);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(q.multi){
      const excl = /Нічого|Ще нічого|Почуваюся добре|Нічого такого/.test(q.o[i][0]);
      if(sel.has(i)) sel.delete(i); else {
        if(excl) sel.clear(); else q.o.forEach((o,j)=>{ if(/Нічого|Ще нічого|Почуваюся добре|Нічого такого/.test(o[0])) sel.delete(j); });
        sel.add(i);
      }
      app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",sel.has(+x.dataset.i)));
      document.getElementById("next").disabled=!sel.size;
    } else { sel.clear(); sel.add(i); app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",sel.has(+x.dataset.i))); document.getElementById("next").disabled=false; }
  });
  document.getElementById("back").onclick=()=>{step--;render();};
  document.getElementById("next").onclick=()=>{ if(sel.size){step++;render();} };
}

function compute(){
  const s={def:0,thy:0,post:0,stress:0,andro:0,care:0}, flags=new Set();
  Q.forEach((q,qi)=>ans[qi].forEach(i=>{const [,w,f]=q.o[i]; for(const k in w) s[k]+=w[k]; if(f) flags.add(f);}));
  const max={def:0,thy:0,post:0,stress:0,andro:0,care:0};
  Q.forEach(q=>{ if(q.multi){ for(const k in max) max[k]+=q.o.reduce((a,o)=>a+(o[1][k]||0),0);} else { for(const k in max) max[k]+=Math.max(0,...q.o.map(o=>o[1][k]||0)); } });
  const pct={}; for(const k in s) pct[k]=Math.round(Math.min(1,s[k]/(max[k]*0.55))*100);
  const order=Object.keys(s).sort((a,b)=>pct[b]-pct[a]||s[b]-s[a]);
  return {s,pct,order,flags};
}

function result(){
  const {pct,order,flags}=compute();
  const top=order[0], second=pct[order[1]]>=40?order[1]:null;
  const main=CAT[top], sec=second?CAT[second]:null;
  const notes=[];
  if(flags.has("noLabs")) notes.push("Ви ще не здавали аналізи під волосся. Так приходить майже половина учасниць, які пройшли перевірку аналізів. Без них неможливо зрозуміти, якого саме дефіциту бракує.");
  if(flags.has("normal")) notes.push("«В нормі» за референсом лабораторії ще не означає норму для волосся. Для фолікулів Оля оцінює аналізи за функціональними оптимумами, і вони вищі.");
  if(flags.has("biotin")) notes.push("Великі дози біотину спотворюють результати деяких аналізів, зокрема на щитовидку. Перед здачею крові його зазвичай припиняють за кілька днів, уточніть це з лікарем.");
  if(flags.has("minox")) notes.push("Міноксидил стимулює ріст, але не закриває дефіцити. Якщо результату немає місяцями, причину варто шукати глибше.");
  const lessons=[main.lesson]; if(sec && sec.lesson[0]!==main.lesson[0]) lessons.push(sec.lesson);
  if(!lessons.some(l=>l[0]==="Урок 2")) lessons.push(CAT.def.lesson);
  const profile=`${top}${second?"_"+second:""}`;
  const href=`${CHECKOUT_URL}?utm_source=quiz&utm_medium=result&utm_content=${profile}&client_reference_id=quiz_${profile}`;
  px("trackCustom","QuizResult", {profile: profile});
  el(`<span class="eyebrow">Ваш результат</span>
  <h2>${sec?`${main.name} + ${sec.short.toLowerCase()}`:main.name}</h2>
  <p class="lead">Найімовірніше, у вас поєднуються кілька факторів. Ось як вони розподілились за вашими відповідями:</p>
  <div class="meter">${order.map(k=>`<div class="mrow"><span>${CAT[k].short}</span><span class="track"><i style="width:${pct[k]}%"></i></span><span>${pct[k]}%</span></div>`).join("")}</div>
  <div class="profile">
    <div class="factor main"><span class="tag">Головний фактор</span><h3>${main.name}</h3><p>${main.what}</p><p><b>Чому догляд не допомагав.</b> ${main.why}</p>
      <div><b>Що варто перевірити:</b><ul class="clean">${main.check.map(c=>`<li>${c}</li>`).join("")}</ul></div></div>
    ${sec?`<div class="factor"><span class="tag">Посилює проблему</span><h3>${sec.name}</h3><p>${sec.what}</p></div>`:""}
  </div>
  ${notes.map(n=>`<div class="note">${n}</div>`).join("")}
  <h3>Що далі</h3>
  <p>Випадіння майже ніколи не має однієї причини, тому окремі засоби дають «покращилось і знову почалось». На 5-денному інтенсиві «Розкішне волосся» Оля пояснює, як знайти саме вашу причину: які аналізи здати, як їх читати і що змінити в харчуванні та догляді.</p>
  <div class="lessons"><b class="small">Найважливіші уроки для вашого профілю</b>${lessons.map(l=>`<div class="lesson"><b>${l[0]}</b><span>${l[1]}</span></div>`).join("")}
    <div class="lesson"><b>Бонуси</b><span>Чек-лист оцінки пошкодження волосся, меню для здоров'я волосся, гайд по шампунях і маскам</span></div></div>
  <div class="price"><strong>${PRICE_LABEL}</strong><span>≈ 480 грн · 5 відеоуроків + вебінар з записом</span></div>
  <a class="btn" id="buy" href="${href}" data-profile="${profile}">Долучитися до інтенсиву за ${PRICE_LABEL}</a>
  <button class="btn ghost" id="again">Пройти тест ще раз</button>
  <p class="small">Результат тесту не є діагнозом. Аналізи призначає і трактує лікар; інтенсив допомагає розібратися, що питати і на що звернути увагу.</p>`);
  document.getElementById("again").onclick=()=>{ans.forEach(a=>a.clear());step=-1;render();};
  // InitiateCheckout при переході на Stripe: спершу відправляємо подію, потім відкриваємо оплату
  document.getElementById("buy").addEventListener("click",function(e){
    e.preventDefault(); const url=this.href;
    try{ if(window.fbq) fbq("track","InitiateCheckout",{value:PRICE,currency:CURRENCY,content_name:"Інтенсив «Розкішне волосся»",content_category:"quiz",num_items:1,profile:this.dataset.profile}); }catch(err){}
    setTimeout(function(){ window.location.href=url; },350);
  });
}

function render(){ if(step<0) intro(); else if(step>=Q.length) result(); else question(); window.scrollTo({top:0}); }
render();
</script>
</body>
</html>
